apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jupyterhub-https
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: jupyterhub
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: aicc-mlops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    traefik.io/description: "JupyterHub - Multi-user Jupyter Notebook Server"
    service-namespace: "jupyterhub"
    cloudflare-proxy: "disabled"  # Important: WebSocket requires direct connection
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jupyter.mlops.work`)
      kind: Rule
      middlewares:
        # Service middleware（from ../services/jupyterhub/）
        - name: jupyterhub-websocket
          namespace: traefik-system
        - name: jupyterhub-buffering
          namespace: traefik-system
        # Golbal middleware（from ../middlewares/）
        - name: security-headers
          namespace: traefik-system
        - name: rate-limit
          namespace: traefik-system
      services:
        - name: proxy-public
          namespace: jupyterhub
          port: 80
          sticky:
            cookie:
              name: JUPYTERHUB_SESSION
              secure: true
              httpOnly: true
              sameSite: lax
          responseForwarding:
            flushInterval: 100ms
  tls:
    secretName: mlops-work-wildcard-tls
    options:
      name: enterprise-tls-policy
      namespace: traefik-system

