apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/part-of: aicc-mlops-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    traefik.io/description: "Traefik Dashboard - Administrative Interface"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.mlops.work`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: rate-limit
          namespace: traefik-system
        - name: security-headers
          namespace: traefik-system
        - name: dashboard-redirect
          namespace: traefik-system
        - name: dashboard-auth
          namespace: traefik-system
  tls:
    secretName: mlops-work-wildcard-tls
    options:
      name: enterprise-tls-policy
      namespace: traefik-system
