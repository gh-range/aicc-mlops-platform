apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: enterprise-tls-policy
  namespace: traefik-system
  labels:
    app.kubernetes.io/part-of: aicc-mlops-platform
    app.kubernetes.io/component: security
  annotations:
    description: "Production TLS Policy - TLS 1.2/1.3 with Modern Cipher Suites"
    updated: "2026-02-10"
    compliance: "PCI DSS 4.0, NIST SP 800-52 Rev.2"
spec:
  # Minimum TLS 1.2 for Cloudflare compatibility
  # Cloudflare → Origin requires TLS 1.2 support
  minVersion: VersionTLS12

  # Cipher Suites (Prioritized for TLS 1.3)
  # Order matters: TLS 1.3 suites are attempted first
  cipherSuites:
    # TLS 1.3 (Preferred)
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256
    - TLS_AES_128_GCM_SHA256

    # TLS 1.2 (Fallback for Cloudflare Proxy)
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

  # Curve Preferences (Modern & Secure)
  curvePreferences:
    - CurveP384
    - CurveP256
    - X25519  # Modern, high-performance curve

  # SNI Strict Mode (Prevents SNI bypass attacks)
  sniStrict: true

  # ALPN Protocols (HTTP/2 priority)
  alpnProtocols:
    - h2
    - http/1.1

  # Prefer server cipher order
  preferServerCipherSuites: true
  
  # Client authentication (optional, disabled for now)
  clientAuth:
    clientAuthType: NoClientCert
