apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.mlops.work`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares: # sort by execution order
        - name: rate-limit
        - name: security-headers
        - name: dashboard-auth
  tls:
    secretName: traefik-dashboard-tls # reversed for https cert
