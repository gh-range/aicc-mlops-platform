apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: middleware
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 100
    sourceCriterion: # Identify user with client ip
      ipStrategy:
        depth: 1
