apiVersion: v1
kind: Namespace
metadata:
  name: traefik-system
  labels:
    name: traefik-system
    purpose: ingress-controller
    tier: infrastructure
    managed-by: helm
  annotations:
    description: "Production-grade Traefik v3 Ingress Controller"
    owner: "platform-engineering"
    cost-center: "infrastructure"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: traefik-resource-quota
  namespace: traefik-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8G
    limits.cpu: "8"
    limits.memory: 16G
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: traefik-limit-range
  namespace: traefik-system
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8G
    min:
      cpu: "100m"
      memory: 128M
    default:
      cpu: "1"
      memory: 2G
    defaultRequest:
      cpu: "500m"
      memory: 1G
    type: Container
