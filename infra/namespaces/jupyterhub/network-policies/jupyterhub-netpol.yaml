apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jupyterhub-proxy
  namespace: jupyterhub
spec:
  podSelector:
    matchLabels:
      component: proxy
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Only allow from Traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
  
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    
    # Allow to hub
    - to:
        - podSelector:
            matchLabels:
              component: hub
      ports:
        - protocol: TCP
          port: 8081
    
    # Allow to user pods
    - to:
        - podSelector:
            matchLabels:
              component: singleuser-server
      ports:
        - protocol: TCP
    
    # Allow external (for webhooks, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jupyterhub-hub
  namespace: jupyterhub
spec:
  podSelector:
    matchLabels:
      component: hub
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow from proxy
    - from:
        - podSelector:
            matchLabels:
              component: proxy
      ports:
        - protocol: TCP
          port: 8081
  
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    
    # Allow to proxy
    - to:
        - podSelector:
            matchLabels:
              component: proxy
      ports:
        - protocol: TCP
          port: 8001
    
    # Allow to user pods
    - to:
        - podSelector:
            matchLabels:
              component: singleuser-server
      ports:
        - protocol: TCP
    
    # Allow Kubernetes API
    - ports:
        - protocol: TCP
          port: 6443
    
    # Allow external (GitHub OAuth, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
