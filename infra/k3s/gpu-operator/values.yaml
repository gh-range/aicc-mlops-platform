# GPU Operator Helm Values
# Environment: k3s + NVIDIA Driver 590.44.01 + CUDA 13.1 + RTX A4000
# Let GPU Operator Chart manage component versions automatically

# Operator configuration
operator:
  defaultRuntime: containerd
  runtimeClass: nvidia

# Use pre-installed host driver (590.44.01)
driver:
  enabled: false

# NVIDIA Container Toolkit - k3s specific paths
toolkit:
  enabled: true
  env:
    - name: CONTAINERD_CONFIG
      value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
    - name: CONTAINERD_SOCKET
      value: /run/k3s/containerd/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "true"

# Device Plugin
devicePlugin:
  enabled: true
  config:
    name: ""
    create: false

# GPU Feature Discovery
gfd:
  enabled: true

# DCGM
dcgm:
  enabled: true

# DCGM Exporter with resource limits
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: false
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Node Feature Discovery - required by GPU Operator
nfd:
  enabled: true

# MIG not supported on RTX A4000
migManager:
  enabled: false

# GPU Direct Storage not needed
gds:
  enabled: false

# Validator - disable for production
validator:
  enabled: false

# Sandbox Workloads
sandboxWorkloads:
  enabled: false

# Deploy on all nodes
nodeSelector: {}
tolerations: []

# Daemonset update strategy
daemonsets:
  updateStrategy: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Priority for GPU Operator pods
priorityClassName: system-node-critical
