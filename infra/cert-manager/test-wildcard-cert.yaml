apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mlops-work-wildcard
  namespace: cert-manager
spec:
  # The secret name where the issued certificate will be stored
  secretName: mlops-work-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.mlops.work"
  dnsNames:
    - "*.mlops.work"
    - "mlops.work"
  # Renewal 30 days before expiry
  renewBefore: 720h

