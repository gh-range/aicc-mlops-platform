apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mlops-work-wildcard
  namespace: cert-manager
spec:
  secretName: mlops-work-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.mlops.work"
  dnsNames:
    - "*.mlops.work"
    - "mlops.work"
  renewBefore: 720h
  # Enhanced security for cert-manager v1.18+
  privateKey:
    rotationPolicy: Always
    algorithm: RSA
    size: 2048
