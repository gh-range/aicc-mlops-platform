apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mlops-work-wildcard
  namespace: traefik-system
spec:
  secretName: mlops-work-wildcard-tls
  issuerRef:
    name: letsencrypt-prod  # `kubectl get clusterissuer`
    kind: ClusterIssuer
  commonName: "*.mlops.work"
  dnsNames:
    - "mlops.work"
    - "*.mlops.work"
