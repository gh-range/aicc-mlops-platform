# JupyterHub Configuration for GPU Time-Slicing

hub:
  image:
     name: quay.io/jupyterhub/k8s-hub
     pullPolicy: IfNotPresent

  db:
    type: sqlite-memory

  resources:
    limits:
      cpu: 2000m
      memory: 2G
      nvidia.com/gpu: "0"

    requests:
      cpu: 200m
      memory: 512M
      nvidia.com/gpu: "0" 

  config:
    JupyterHub:
      admin_access: true
      authenticator_class: dummy

proxy:
  chp:
    resources:
      limits:
        cpu: 500m
        memory: 512M
        nvidia.com/gpu: "0"
      requests:
        cpu: 100m
        memory: 256M
        nvidia.com/gpu: "0"

  service:
    type: NodePort
    nodePorts:
      http: 30080

# User Scheduler don't need GPU
scheduling:
  userScheduler:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256M
        nvidia.com/gpu: "0"
      limits:
        cpu: 200m
        memory: 512M
        nvidia.com/gpu: "0"

# Image Puller don't need GPU
prePuller:
  resources:
    requests:
      cpu: 100m
      memory: 128M
      nvidia.com/gpu: "0"
    limits:
      cpu: 200m
      memory: 256M
      nvidia.com/gpu: "0"
  hook:
    enabled: true
  continuous:
    enabled: true

singleuser:
  extraResource:
    limits:
      nvidia.com/gpu: "1"
    guarantees:
      nvidia.com/gpu: "1"

  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 4G
    guarantee: 1G

  image:
    name: quay.io/jupyter/base-notebook
    tag: latest
    pullPolicy: IfNotPresent
 
  # AUTO strategy: installs zh-TW language pack at pod startup.
  # See docker/jupyter-notebook/README.md for the MANUAL (custom image)
  # alternative to switch to once the base image tag is finalized.
  lifecycleHooks:
    postStart:
      exec:
        command:
          - "sh"
          - "-c"
          - >
            pip install --quiet --no-cache-dir jupyterlab-language-pack-zh-TW || true

  storage:
    type: dynamic
    dynamic:
      storageClass: local-path
    capacity: 10G

  cloudMetadata:
    blockWithIptables: false

rbac:
  create: true

