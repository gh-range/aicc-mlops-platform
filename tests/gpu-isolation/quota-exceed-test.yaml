---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-3-exceed
  namespace: gpu-test-a
  labels:
    app: gpu-quota-exceed-test
    test-type: negative
spec:
  restartPolicy: Never
  containers:
  - name: cuda-test
    image: nvidia/cuda:13.1.0-base-ubuntu24.04
    command: ["/bin/bash", "-c"]
    args:
      - |
        echo "This pod should NOT be scheduled";
        echo "Quota limit: 2 GPU, already used: 2";
        sleep 3600;
    resources:
      requests:
        nvidia.com/gpu: "1"
        memory: "1G"
        cpu: "500m"
      limits:
        nvidia.com/gpu: "1"
        memory: "2G"
        cpu: "1"
