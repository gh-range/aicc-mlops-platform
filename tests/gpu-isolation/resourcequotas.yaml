---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gpu-quota
  namespace: gpu-test-a
  labels:
    managed-by: infrastructure-team
    quota-type: compute-resources
spec:
  hard:
    # GPU Resources
    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"

    # CPU Resources
    requests.cpu: "4"
    limits.cpu: "8"

    # Memory Resources
    requests.memory: "8G"
    limits.memory: "16G"

    # Object Count Limits
    pods: "10"
    persistentvolumeclaims: "5"
    services: "5"

